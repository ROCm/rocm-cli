# Per-scenario expected-failure (xfail) matrix, keyed by scenario @id.
#
# This file holds the irreducibly manual part of the expectation system: a known
# BUG is a defect the capability probe cannot infer, so each is declared here.
# Everything else — is the required engine available on this host? what engine
# does `serve` default to? does this platform prefer vLLM? — is DERIVED from the
# host capability probe (see src/capability.rs) and is NOT encoded here.
#
# Resolution at runtime (see tests/e2e-cucumber/src/expectation.rs):
#   1. A scenario whose @requires-gpu / @requires-engine / @requires-bare-metal
#      can't be satisfied on this host is SKIPPED (not-applicable) — never listed
#      here. Reach for a tag, not a row, whenever the scenario simply has no
#      premise on that host: a row here says "known BUG", so using one for
#      designed-in behaviour (e.g. diagnose not offering a bare-metal cause on
#      WSL2, where no amdgpu module exists to blame) tells every later reader the
#      opposite of the truth.
#   2. Otherwise, the FIRST matching condition below marks it expected-fail
#      (xfail); a scenario that then PASSES is an XPASS — a stale entry to be
#      removed, UNLESS the row is `flaky = true`, which tolerates either result
#      while the bug stays open (see the grammar below).
#   3. No matching condition → expected-pass.
#
# Condition predicate grammar (deliberately tiny):
#   [[<scenario-id>]]                 one table per condition (arrays = OR)
#   when = { effective_engine = "vllm", os = "linux", has_amd_gpu = true }
#                                     all present keys must match (AND)
#   bug = "EAI-NNNN"                  ticket reference (shown in the report)
#   reason = "..."                    human explanation (shown in the report)
#   serve_timeout_secs = 90          optional: shorter serve wait for a known bug
#   flaky = true                     optional: bug reproduces only intermittently,
#                                    so an XPASS is tolerated (reported, not stale)
#
# An empty `when = {}` means "always xfail" (platform-independent bug).

# --- EAI-7219: short-name expansion (vLLM does not show an expanded name) ---
# What the lane logs show, so the scope below is not read as more than it is:
# lemonade prints the full name on the Strix Halo Ubuntu and Windows lanes, and
# vLLM's stdout is empty -- the run stopped before it printed a serve plan, so the
# plan's name line was never reached. vLLM is therefore the whole of what keeps
# these rows red.
#
# ROCMAI-863's pre-launch refusal does NOT reach these rows, though an earlier
# revision of this comment said it did. That was written when `qwen2.5` expanded
# to the bare `Qwen/Qwen2.5-1.5B-Instruct`, which ships no GGUF; #1044 then gave
# that recipe a per-engine ref, so lemonade is handed
# `Qwen/Qwen2.5-1.5B-Instruct-GGUF:Q4_K_M` with the variant already pinned and
# the refusal has nothing to fire on. The lemonade half still prints its name.
# EAI-7219 as reported describes
# the other shape: a vLLM plan that prints `resolved model: qwen2.5`, the alias
# left unexpanded; the lane logs have not shown it. The steps used to discard
# stderr, so the cause of the empty stdout was not known. The first lane run
# that reported it (run 41811714290: Strix Halo Ubuntu release and nightly, and
# MI300X) shows vLLM stopping at "no active ROCm runtime is configured", before
# any alias handling, so on those lanes the rows are red for a missing runtime
# and not for this bug. On native Windows the stop is the up-front vLLM refusal
# (ROCMAI-823), a designed refusal and not this bug either.
# The rows keep their all-hosts scope until the scenarios get a managed runtime or
# are gated on the engine and the rows are narrowed to the real bug; their reasons
# name both shapes so neither becomes a false claim.
#
# Looking forward rather than back, and not yet observed on any lane: the catalog
# now gives `qwen2.5` a per-engine model id, so the name lemonade prints is
# expected to become `Qwen/Qwen2.5-1.5B-Instruct-GGUF:Q4_K_M` while vLLM keeps
# `Qwen/Qwen2.5-1.5B-Instruct`. The two differing is by design, which is why
# serve-02 asks each engine to expand the alias rather than to agree on a name.
[["serve-short-name-expansion"]]
when = {}
bug = "EAI-7219"
reason = "A vLLM serve of a short name shows no expanded full model name: it either stops before printing a serve plan or prints the alias unexpanded."

[["serve-short-name-consistent-across-engines"]]
when = {}
bug = "EAI-7219"
reason = "A serve of a short name does not show the full model name the engine will serve: vLLM either stops before printing a serve plan or prints the alias unexpanded, and the lemonade half is only reached once that stops happening."

# --- ROCMAI-1023: `services list` does not show the Anthropic endpoint row ---
# On the Strix Halo Ubuntu lanes the lemonade serve itself succeeds and the model
# answers on /v1/models, but `rocm services list` then shows no
# `anthropic endpoint:` row within the step's 30s poll. Seen intermittently on main
# after the Lemonade serve fix (#963): serve-50 in jobs 129254733795 and
# 129309536682, serve-52 in jobs 129309527901, 129318300169, 129700937355 and
# 130496332636; both also passed in most runs over the same period, hence
# `flaky = true`. No `serve_timeout_secs`: the serve becomes ready, so a shorter
# serve wait would only cut short a slow but healthy serve.
[["serve-anthropic-endpoint-advertised"]]
when = { effective_engine = "lemonade", os = "linux" }
bug = "ROCMAI-1023"
reason = "After the lemonade service is ready, `rocm services list` intermittently shows no `anthropic endpoint:` row, so the Anthropic endpoint is not advertised."
flaky = true

[["serve-anthropic-endpoint-readiness"]]
when = { effective_engine = "lemonade", os = "linux" }
bug = "ROCMAI-1023"
reason = "After the lemonade service is ready, `rocm services list` intermittently shows no `anthropic endpoint:` row, so readiness cannot be seen to cover the Anthropic endpoint."
flaky = true

# --- EAI-7223: requests with tool definitions rejected (vLLM path) ---
[["serve-anthropic-messages-tool-use"]]
when = { effective_engine = "vllm" }
bug = "EAI-7223"
reason = "The served vLLM model is started without a tool-call parser, so it rejects a request that names a tool; the endpoint relays that refusal."
serve_timeout_secs = 90

[["chat-tool-definitions-accepted"]]
when = { effective_engine = "vllm" }
bug = "EAI-7223"
reason = "Chat requests carrying tool definitions are not accepted by the served vLLM model."
serve_timeout_secs = 90

# --- Lemonade 11.5.1 cannot align its llama.cpp backend to a ROCm 7.14.x SDK ---
# `rocm engines install lemonade` tries to align Lemonade's `llamacpp:rocm`
# backend with the active ROCm SDK. Lemonade 11.5.1, the pin in
# `runtime-deps.toml`, downloads the TheRock tarball it pairs with the backend
# only from https://repo.amd.com/rocm/tarball/, a path the 7.14.x tarballs are not
# published to (AMD's 7.14 install guide uses /rocm/tarball-multi-arch/), so the
# download answers HTTP 403 for `therock-dist-<os>-<family>-7.14.1.tar.gz`. The
# pinned llama.cpp build has no ROCm 7.14 asset either (HTTP 404), so every tier
# of the alignment fails and the CLI reverts to Lemonade's pinned ROCm 7.13
# backend. Reproduced on a Strix Halo Linux box with an isolated root, not only on
# the CI runners, so the failed alignment is not specific to Windows; the scenarios
# below only fail there (runtime-16 is `@requires-os:windows`, and serve-06 passed on
# the W7900 and MI300X lanes of the 2026-11-05 run).
#
# runtime-16 asserts the alignment succeeded, which it cannot while the 7.14.x
# tarball is unreachable. serve-06 serves a 35B model through the Windows lane's
# 7.13 backend against the SDK's 7.14.1 libraries and the server crashes in the
# SDK's Tensile library on the first inference request (access violation in the
# lane's service log). The mismatch between the backend and the SDK is the
# suspected cause; it has NOT been reproduced off Windows, so the row names both
# facts. Both rows are deterministic (both scenarios failed on each Windows lane
# run examined: 2026-10-28, 2026-11-05 and 2026-11-06), so neither is `flaky`: an
# XPASS means the cause is gone and the row should be deleted. Neither row sets
# `serve_timeout_secs`: serve-06's own `@serve-timeout:2400` tag takes precedence
# over a row, so a shorter wait here would have no effect, and the failing
# serve-06 still holds the Windows lane for the full 2400s wait.
[["runtime-lemonade-backend-alignment-reported"]]
when = { effective_engine = "lemonade", os = "windows" }
bug = "ROCMAI-899"
reason = "Lemonade 11.5.1 fetches TheRock only from repo.amd.com/rocm/tarball/, where 7.14.x is not published (HTTP 403), so its backend cannot be aligned to a 7.14.x SDK and the install reverts to the pinned 7.13 backend."

[["serve-large-model-inference"]]
when = { effective_engine = "lemonade", os = "windows" }
bug = "ROCMAI-900"
reason = "The Windows large-model serve crashes in the SDK's Tensile library on the first inference request; the pinned ROCm 7.13 backend runs against the 7.14.1 SDK because Lemonade 11.5.1 cannot align it (suspected cause, not reproduced off Windows)."

# Scoped to native Linux Strix Halo, the only place it has been seen (evidence is
# in the tracking issue); `is_wsl = false` keeps WSL2, which also reports
# `os = "linux"` on gfx1151, out of it, so a WSL host that gains Docker and passes
# the scenario is not an XPASS. A host without Docker skips the scenario before
# this row applies.
[["serve-aim-lifecycle-parity"]]
when = { os = "linux", is_wsl = false, therock_family = "gfx1151*", has_amd_gpu = true }
bug = "rocm-cli#1058"
reason = "Stopping a running AIM service on Strix Halo Ubuntu reports `Local server stop not confirmed` (exit 1); the serve itself works."
