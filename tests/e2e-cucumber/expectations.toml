# Bench's real-serve precondition is blocked by #897 on the same Linux hosts.
#
# This does NOT weaken the coverage the bench fix relies on: the five
# MockServer-backed bench scenarios (bench-01 to bench-05) run unxfail'd on
# every lane, including this one, and they are what pin the request path, the
# failure reporting, the CSV columns, and the rollup-split warning.
[["bench-load-real-serve"]]
when = { effective_engine = "lemonade", os = "linux", therock_family = "gfx*", has_amd_gpu = true }
bug = "#897"
reason = "Lemonade managed serve never exposes the model: observed backend argument rejection, backend download failure, or backend-ready/router-unavailable."
serve_timeout_secs = 90
flaky = true

# serve-40 has the same serve precondition; this is not an automation-helper bug.
# xfail + flaky tolerates either outcome, so on this lane the "no background
# helper" assertion carries no signal until #897 is closed: a pass here does not
# show the scenario's own behaviour is healthy, and a failure is not attributed
# to it. Remove the row once #897 is fixed.
[["serve-stop-leaves-no-background-helper"]]
when = { effective_engine = "lemonade", os = "linux" }
bug = "#897"
reason = "Lemonade managed serve never exposes the model: observed backend argument rejection, backend download failure, or backend-ready/router-unavailable."
serve_timeout_secs = 90
