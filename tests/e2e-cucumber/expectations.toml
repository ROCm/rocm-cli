# Per-scenario expected-failure (xfail) matrix, keyed by scenario @id.
#
# This file holds the irreducibly manual part of the expectation system: a known
# BUG is a defect the capability probe cannot infer, so each is declared here.
# Everything else — is the required engine available on this host? what engine
# does `serve` default to? does this platform prefer vLLM? — is DERIVED from the
# host capability probe (see src/capability.rs) and is NOT encoded here.
#
# Resolution at runtime (see tests/e2e-cucumber/src/expectation.rs):
#   1. A scenario whose @requires-gpu / @requires-engine / @requires-bare-metal
#      can't be satisfied on this host is SKIPPED (not-applicable) — never listed
#      here. Reach for a tag, not a row, whenever the scenario simply has no
#      premise on that host: a row here says "known BUG", so using one for
#      designed-in behaviour (e.g. diagnose not offering a bare-metal cause on
#      WSL2, where no amdgpu module exists to blame) tells every later reader the
#      opposite of the truth.
#   2. Otherwise, the FIRST matching condition below marks it expected-fail
#      (xfail); a scenario that then PASSES is an XPASS — a stale entry to be
#      removed, UNLESS the row is `flaky = true`, which tolerates either result
#      while the bug stays open (see the grammar below).
#   3. No matching condition → expected-pass.
#
# Condition predicate grammar (deliberately tiny):
#   [[<scenario-id>]]                 one table per condition (arrays = OR)
#   when = { effective_engine = "vllm", os = "linux", has_amd_gpu = true }
#                                     all present keys must match (AND)
#   bug = "EAI-NNNN"                  ticket reference (shown in the report)
#   reason = "..."                    human explanation (shown in the report)
#   serve_timeout_secs = 90          optional: shorter serve wait for a known bug
#                                    (wins over the scenario's @serve-timeout tag)
#   flaky = true                     optional: bug reproduces only intermittently,
#                                    so an XPASS is tolerated (reported, not stale)
#
# An empty `when = {}` means "always xfail" (platform-independent bug).

# --- EAI-7219: short-name expansion (vLLM does not show an expanded name) ---
# What the lane logs show, so the scope below is not read as more than it is:
# lemonade prints the full name on the Strix Halo Ubuntu and Windows lanes, and
# vLLM's stdout is empty -- the run stopped before it printed a serve plan, so the
# plan's name line was never reached. vLLM is therefore the whole of what keeps
# these rows red.
#
# ROCMAI-863's pre-launch refusal does NOT reach these rows, though an earlier
# revision of this comment said it did. That was written when `qwen2.5` expanded
# to the bare `Qwen/Qwen2.5-1.5B-Instruct`, which ships no GGUF; #1044 then gave
# that recipe a per-engine ref, so lemonade is handed
# `Qwen/Qwen2.5-1.5B-Instruct-GGUF:Q4_K_M` with the variant already pinned and
# the refusal has nothing to fire on. The lemonade half still prints its name.
# EAI-7219 as reported describes
# the other shape: a vLLM plan that prints `resolved model: qwen2.5`, the alias
# left unexpanded; the lane logs have not shown it. The steps used to discard
# stderr, so the cause of the empty stdout was not known. The first lane run
# that reported it (run 41811714290: Strix Halo Ubuntu release and nightly, and
# MI300X) shows vLLM stopping at "no active ROCm runtime is configured", before
# any alias handling, so on those lanes the rows are red for a missing runtime
# and not for this bug. On native Windows the stop is the up-front vLLM refusal
# (ROCMAI-823), a designed refusal and not this bug either.
# The rows keep their all-hosts scope until the scenarios get a managed runtime or
# are gated on the engine and the rows are narrowed to the real bug; their reasons
# name both shapes so neither becomes a false claim.
#
# Looking forward rather than back, and not yet observed on any lane: the catalog
# now gives `qwen2.5` a per-engine model id, so the name lemonade prints is
# expected to become `Qwen/Qwen2.5-1.5B-Instruct-GGUF:Q4_K_M` while vLLM keeps
# `Qwen/Qwen2.5-1.5B-Instruct`. The two differing is by design, which is why
# serve-02 asks each engine to expand the alias rather than to agree on a name.
[["serve-short-name-expansion"]]
when = {}
bug = "EAI-7219"
reason = "A vLLM serve of a short name shows no expanded full model name: it either stops before printing a serve plan or prints the alias unexpanded."

[["serve-short-name-consistent-across-engines"]]
when = {}
bug = "EAI-7219"
reason = "A serve of a short name does not show the full model name the engine will serve: vLLM either stops before printing a serve plan or prints the alias unexpanded, and the lemonade half is only reached once that stops happening."

# --- ROCMAI-898 (closed): Lemonade managed serve on Linux ---
# ROCMAI-898 (a Lemonade serve on Linux exits 0 and the model is never served)
# is closed. Two changes addressed it: #963 made a registered Lemonade model
# name resolve when it is served directly on Linux, and #1150 serves a simple
# registered GGUF labelled `chat` directly instead of through Lemonade's router.
# Before #1150, on the Strix Halo Ubuntu lanes, a serve could find port 11435
# already taken (Lemonade failing to bind it) or come up on another port while
# the step waited on 11435, and most of those lanes' push jobs from 2026-11-17
# failed some of the scenarios below that way. #1150's own account names a
# router serve from an earlier scenario as the likely occupant of 11435, but
# that has not been observed. The rows were `flaky = true`, so a pass was
# tolerated instead of being reported as stale. The Lemonade-on-Linux rows for
# serve-07, serve-40, serve-51, serve-53, serve-54, chat-06, chat-07, bench-06
# and dash-52 have been deleted because of the lane evidence since #1150.
#
# How counted: the XPASS lines in the job logs of the "E2E self-hosted" push
# runs on main and of the "Nightly" runs from #1150 (2026-11-19) to 2026-11-23,
# and the lane logs and reports of the 2026-11-20 queue nightly.
# - Strix Halo Ubuntu: all nine passed in every job, both channels (counted as:
#   24 push jobs, excluding one build-broken run, and 8 nightly jobs).
# - W7900, an advisory queue lane (docs/nightly-on-the-queue.md): all nine
#   passed in its one queue nightly run, both channels.
# - serve-07, serve-40 and dash-52 pin Lemonade, so they also serve with it on
#   Instinct: all three passed on the MI300X lane (counted as: the 3 push runs
#   whose MI300X job log has a reconciliation line). On the MI355X queue lane's
#   release channel dash-52 failed once, its model pull refused with a Hugging
#   Face HTTP 429; that lane's other failures in that run were not examined.
#
# None of this covers serve-57 (`serve-lemonade-complex-registered-inference`),
# which is expected to keep the router after #1150: the scenario's own comment
# (`COMPLEX_REGISTERED_MODEL` in tests/e2e-cucumber/tests/e2e/serving_steps.rs)
# records that its Lemonade 11.5.1 catalog entry carries an mmproj file, and an
# entry with one still goes to the router. That entry has not been checked
# against the pinned 2026.44.1 catalog. It has no row; see its comment in
# model_serving.feature. The evidence is for the pinned Lemonade 2026.44.1 with
# llama.cpp b11580, not for every build. What is left below is either a
# different open bug the old rows also masked, or a scenario no Linux lane runs.
#
# serve-09, serve-10 and serve-12 are `@merge-queue`, and no Linux GPU lane runs
# a merge-queue scenario: `resolve` in tests/e2e-cucumber/src/expectation.rs
# skips them unless E2E_MERGE_QUEUE is set, the merge queue sets it only on the
# Windows Strix Halo and WSL2 lanes, and the WSL2 lane reports no usable GPU
# (`mi300x_lane_is_skipped_in_the_merge_queue` in xtask/src/workflow_contract.rs
# keeps the Linux GPU lanes out of the queue). So no run has shown them passing
# since the fix, and their rows stay. They serve the same model as scenarios
# that now pass on the Strix Halo Ubuntu and W7900 lanes: serve-12 starts from
# the same `a model is being served on GPU` step as serve-50 to serve-54, and
# serve-09 and serve-10 serve the same model without naming the engine. Delete
# these three rows once a Linux Lemonade GPU run of them passes, for example
# `E2E_MERGE_QUEUE=1 cargo xtask e2e` on such a host.
[["serve-default-engine-working-endpoint"]]
when = { effective_engine = "lemonade", os = "linux" }
bug = "ROCMAI-898"
reason = "Not re-checked since ROCMAI-898 was fixed: no Linux Lemonade lane runs this merge-queue scenario. The fixed failure was a Lemonade managed serve that never exposed the model."
serve_timeout_secs = 90
flaky = true

[["serve-default-engine-inference"]]
when = { effective_engine = "lemonade", os = "linux" }
bug = "ROCMAI-898"
reason = "Not re-checked since ROCMAI-898 was fixed: no Linux Lemonade lane runs this merge-queue scenario. The fixed failure was a Lemonade managed serve that never exposed the model."
serve_timeout_secs = 90
flaky = true

[["serve-readiness-contract"]]
when = { effective_engine = "lemonade", os = "linux" }
bug = "ROCMAI-898"
reason = "Not re-checked since ROCMAI-898 was fixed: no Linux Lemonade lane runs this merge-queue scenario. The fixed failure was a Lemonade managed serve that never exposed the model."
serve_timeout_secs = 90
flaky = true

# --- ROCMAI-1023: `services list` sometimes shows no Anthropic endpoint row ---
# On the Strix Halo Ubuntu lanes the Lemonade service is ready, but `rocm
# services list` shows no `anthropic endpoint:` row within the step's 30s poll
# (`listed_anthropic_endpoint` in tests/e2e-cucumber/tests/e2e/serving_steps.rs).
# Seen in about 2 of 220 jobs for serve-50 and 4 of 218 for serve-52 (2026-11-09
# to 2026-11-11, as counted in that ticket), while the ROCMAI-898 rows were
# masking it. serve-51, serve-53 and serve-54 read the same listing and have no
# row; serve-53 and serve-54 hit it in Strix Halo Ubuntu push jobs on
# 2026-11-16. #1045 (merged 2026-11-16) made the service state file's writers,
# rocmd's publishing of this endpoint among them, take a lock, which may be the
# fix; there have been too few clean jobs since #1045 to tell a low rate from
# zero. The serve itself succeeds, so the rows set no serve wait.
[["serve-anthropic-endpoint-advertised"]]
when = { effective_engine = "lemonade", os = "linux" }
bug = "ROCMAI-1023"
reason = "After the Lemonade service is ready, `rocm services list` intermittently shows no `anthropic endpoint:` row within the 30s poll."
flaky = true

[["serve-anthropic-endpoint-readiness"]]
when = { effective_engine = "lemonade", os = "linux" }
bug = "ROCMAI-1023"
reason = "After the Lemonade service is ready, `rocm services list` intermittently shows no `anthropic endpoint:` row within the 30s poll."
flaky = true

