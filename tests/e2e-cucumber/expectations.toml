# Per-scenario expected-failure (xfail) matrix, keyed by scenario @id.
#
# This file holds the irreducibly manual part of the expectation system: a known
# BUG is a defect the capability probe cannot infer, so each is declared here.
# Everything else — is the required engine available on this host? what engine
# does `serve` default to? does this platform prefer vLLM? — is DERIVED from the
# host capability probe (see src/capability.rs) and is NOT encoded here.
#
# Resolution at runtime (see tests/e2e-cucumber/src/expectation.rs):
#   1. A scenario whose @requires-gpu / @requires-engine / @requires-bare-metal
#      can't be satisfied on this host is SKIPPED (not-applicable) — never listed
#      here. Reach for a tag, not a row, whenever the scenario simply has no
#      premise on that host: a row here says "known BUG", so using one for
#      designed-in behaviour (e.g. diagnose not offering a bare-metal cause on
#      WSL2, where no amdgpu module exists to blame) tells every later reader the
#      opposite of the truth.
#   2. Otherwise, the FIRST matching condition below marks it expected-fail
#      (xfail); a scenario that then PASSES is an XPASS — a stale entry to be
#      removed, UNLESS the row is `flaky = true`, which tolerates either result
#      while the bug stays open (see the grammar below).
#   3. No matching condition → expected-pass.
#
# Condition predicate grammar (deliberately tiny):
#   [[<scenario-id>]]                 one table per condition (arrays = OR)
#   when = { effective_engine = "vllm", os = "linux", has_amd_gpu = true }
#                                     all present keys must match (AND)
#   bug = "EAI-NNNN"                  ticket reference (shown in the report)
#   reason = "..."                    human explanation (shown in the report)
#   serve_timeout_secs = 90          optional: shorter serve wait for a known bug
#   flaky = true                     optional: bug reproduces only intermittently,
#                                    so an XPASS is tolerated (reported, not stale)
#
# An empty `when = {}` means "always xfail" (platform-independent bug).

# --- EAI-7219: short-name expansion (vLLM does not show an expanded name) ---
# What the lane logs show, so the scope below is not read as more than it is:
# lemonade DOES print the full name (`resolved model: Qwen/Qwen2.5-1.5B-Instruct`)
# on the Strix Halo Ubuntu and Windows lanes, and vLLM's stdout is empty -- the run
# stopped before it printed a serve plan, so the plan's name line was never
# reached. EAI-7219 as reported describes the other shape: a vLLM plan that prints
# `resolved model: qwen2.5`, the alias left unexpanded; the lane logs have not
# shown it. The steps used to discard stderr, so the cause of the empty stdout was
# not known. The first lane run that reported it (run 41811714290: Strix Halo
# Ubuntu release and nightly, and MI300X) shows vLLM stopping at "no active ROCm
# runtime is configured", before any alias handling, so on those lanes the rows are
# red for a missing runtime and not for this bug. On native Windows the stop is the
# up-front vLLM refusal (ROCMAI-823), a designed refusal and not this bug either.
# The rows keep their all-hosts scope until the scenarios get a managed runtime or
# are gated on the engine and the rows are narrowed to the real bug; their reasons
# name both shapes so neither becomes a false claim.
[["serve-short-name-expansion"]]
when = {}
bug = "EAI-7219"
reason = "A vLLM serve of a short name shows no expanded full model name: it either stops before printing a serve plan or prints the alias unexpanded."

[["serve-short-name-consistent-across-engines"]]
when = {}
bug = "EAI-7219"
reason = "A vLLM serve of a short name does not resolve to lemonade's full model name: it either stops before printing a serve plan or prints the alias unexpanded."

# ROCMAI-898 tracks multiple Strix Halo Ubuntu Lemonade serve signatures (first
# tracked as GitHub issue ROCm/rocm-cli#897, since closed; ROCMAI-898 is the open
# ticket and what the rows below name):
# the child rejects --no-mmap (41984921053), backend readiness on :8001 without
# the model appearing on :11435 (41984503055), and backend download failure
# (41986772728). A backend ready line does not prove a later shutdown.
# EAI-7423 described only the earlier ready-then-unavailable symptom.
# Retain flaky=true because historical runs also passed intermittently; do not
# infer a fix from a single XPASS. The flag is per-row and is NOT derived from
# `bug`, so a new ROCMAI-898 row needs `flaky = true` added explicitly.
# Failed serves now capture configured pins, candidate executable paths and
# fingerprints before stopping the service, and each candidate's --version/--help
# after it.
# Revisit under EAI-7853 before deleting any of these rows: which lemonade build
# a given run used could not be read back from this lane, and until a failed run
# there has carried that evidence, an XPASS streak is not by itself evidence that
# the bug is fixed.
#
# os=linux: native Windows passed (29338475133 Strix-Windows).
[["serve-default-engine-working-endpoint"]]
when = { effective_engine = "lemonade", os = "linux" }
bug = "ROCMAI-898"
reason = "Lemonade managed serve never exposes the model: observed backend argument rejection, backend download failure, or backend-ready/router-unavailable."
serve_timeout_secs = 90
flaky = true

