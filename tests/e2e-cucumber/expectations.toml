# serve-40 serves the same small GGUF model through the same lemonade managed serve
# as the rows above, so on a lemonade LINUX host its When step never sees the model
# on /v1/models and panics before the Then assertion runs. Scoped like those rows
# (os=linux). Known from run 41986772728: serve-40 passes on the Strix Halo Windows
# lane, is skipped on the Strix Halo WSL2 lane (no AMD GPU detected), and fails on
# both Strix Halo Ubuntu lanes. The row also matches any other Linux host that runs
# the scenario with lemonade (the MI300X and W7900 lanes had not reported in that
# run); whether lemonade serves there is not verified, and `flaky = true` tolerates
# a pass on such a host. The cause on the Strix Halo Ubuntu lanes is not settled
# and varies between runs (ROCMAI-898), so this row names that ticket rather than
# EAI-7423
# and carries `flaky = true` like its siblings. While it is in place the
# scenario's own check (serve starts no background helper when no watcher is
# enabled) is not exercised on the hosts it matches, and a genuine failure of that
# check there would also read as a failure that was expected. `flaky` also means a
# fixed ROCMAI-898 is not flagged as a stale row, so delete the row by hand when
# ROCMAI-898 is
# closed.
[["serve-stop-leaves-no-background-helper"]]
when = { effective_engine = "lemonade", os = "linux" }
bug = "ROCMAI-898"
reason = "Lemonade serving fails on the Strix Halo Ubuntu lanes, so the model never appears on /v1/models and the helper check is never reached."
serve_timeout_secs = 90
flaky = true

