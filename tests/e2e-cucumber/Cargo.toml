[package]
name = "e2e-cucumber"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
publish = false

[lints]
workspace = true

# Standalone mock-environment runner for documentation screencasts (see
# docs/tapes/). Reuses this crate's mock server; not part of the test harness.
[[bin]]
name = "rocm-demo-env"
path = "src/bin/rocm-demo-env.rs"

# Stand-in for the Tailscale CLI, put on PATH by the `rocm remote` scenarios so
# they do not depend on the developer's own machine being on a tailnet.
[[bin]]
name = "fake-tailscale"
path = "src/bin/fake-tailscale.rs"

# Stand-in for the hardware-describing tools (`uname`, `lspci`, `ldconfig`, ...)
# a simulated host is read with; see `src/simulated_host.rs`.
[[bin]]
name = "fake-host-tool"
path = "src/bin/fake-host-tool.rs"

# Stand-in for a managed runtime's `vllm`: serves the mock OpenAI routes on the
# host and port the CLI launches it with.
[[bin]]
name = "fake-vllm"
path = "src/bin/fake-vllm.rs"

[dependencies]
axum.workspace = true
cucumber = { version = "0.23", features = ["output-json", "output-junit"] }
e2e-report = { path = "../../crates/e2e-report" }
# Builds the paced download fixture's chunked response body (`stream::unfold`).
futures = "0.3"
# Drive the interactive dash TUI black-box: spawn the real `rocm` binary under a
# pseudo-terminal (`portable-pty`, cross-platform openpty/ConPTY) and parse the
# emitted terminal stream into the current on-screen grid (`vt100`). This is the
# only way to exercise the crossterm raw-mode event loop a piped `Command` can't.
portable-pty = "0.9"
# Deterministic filler bytes for the paced-download fixtures (see
# `src/paced_download.rs`) — a seeded `StdRng` rather than a hand-rolled PRNG.
rand.workspace = true
reqwest = { version = "0.13", features = ["json"] }
serde.workspace = true
serde_json.workspace = true
tempfile = "3"
tokio.workspace = true
toml = "1.1"
# `ServeDir` backs the install scenario's loopback download server (see
# `src/loopback_http.rs`), so the E2E suite does not hand-roll HTTP framing,
# socket-mode handling, or path-traversal defence. 0.6 is the version reqwest
# already pulls in, so this adds no second copy to the tree.
tower-http = { version = "0.6", features = ["fs"] }
url = "2"
vt100 = "0.16"

[dev-dependencies]
# `FileLock`, so the service-cleanup lane can hold the managed-launch lock that a
# real `rocm serve` holds and watch a real `rocm services prune` *process* block
# on it. Using the production type rather than a hand-rolled `flock` is the
# point: the scenario proves the two contend across process boundaries, which is
# the property the fix rests on and which no in-process test can show.
#
# A dev-dependency, not a normal one: the only use is in the `e2e` test target
# below, nothing under `src/` touches it, and `xtask check-crate-edges` exempts
# dev edges by design — so keeping it here needs no allowlist entry.
rocm-core = { path = "../../crates/rocm-core" }

[[test]]
name = "e2e"
harness = false
# The suite drives the real `rocm` binary (installs, GPU probes, a mock server)
# and is meant to run only via `cargo xtask e2e` on Linux. Exclude it from the
# default test set so `cargo test`/`--all-targets` (e.g. the Windows job) and
# `cargo nextest` skip it — they would otherwise run every scenario unfiltered
# with no mock and fail. `xtask e2e`'s explicit `--test e2e` still runs it.
test = false
