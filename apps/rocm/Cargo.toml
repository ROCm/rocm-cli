[package]
name = "rocm"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
publish.workspace = true

[lints]
workspace = true

[features]
e2e-test-hooks = ["rocm-engine-lemonade/e2e-test-hooks"]
# Test-only fault injection for the e2e suite. Enabled ONLY by the `xtask e2e`
# mock-lane build (never by the release build), it compiles in a `rocm serve`
# hook that simulates a managed vLLM launch which OOM'd and never became ready,
# so the positive OOM-guidance summary can be verified on a GPU-less CI host.
# See `e2e_simulate_oom_launch` / `simulate_oom_managed_launch` in `main.rs`.
e2e-oom-fault-injection = []

[dependencies]
anyhow.workspace = true
clap.workspace = true
clap_complete.workspace = true
crossterm.workspace = true
flate2 = "1.1"
keyring-core.workspace = true
rocm-core = { path = "../../crates/rocm-core" }
rocm-deps = { path = "../../crates/rocm-deps" }
# rocm-dash unified dashboard launch. The
# telemetry daemon + ratatui-0.30 TUI are launched from the `dash` verb; tokio
# drives the async daemon/TUI from the otherwise-sync `rocm` binary.
# rocm-dash-core is a direct dep so the launcher front door can build serving
# `Instance`s from the managed-service registry.
rocm-dash-core = { path = "../../crates/rocm-dash-core" }
rocm-dash-daemon = { path = "../../crates/rocm-dash-daemon" }
rocm-dash-tui = { path = "../../crates/rocm-dash-tui" }
tokio = { workspace = true }
rocm-engine-lemonade = { path = "../../engines/lemonade" }
rocm-engine-protocol = { path = "../../crates/rocm-engine-protocol" }
rocmd = { path = "../rocmd" }
rocm-engine-vllm = { path = "../../engines/vllm" }
rpassword.workspace = true
serde.workspace = true
serde_json.workspace = true
tar = "0.4"
tracing = "0.1"
tracing-appender = "0.2"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
ureq = { version = "2.12", features = ["native-certs"] }

[target.'cfg(unix)'.dependencies]
libc.workspace = true

[target.'cfg(windows)'.dependencies]
windows-native-keyring-store = "1.1"
windows-sys = { version = "0.61", features = ["Win32_Storage_FileSystem"] }

[target.'cfg(target_os = "macos")'.dependencies]
apple-native-keyring-store = { version = "1.0", features = ["keychain"] }

[target.'cfg(any(target_os = "linux", target_os = "freebsd", target_os = "openbsd"))'.dependencies]
zbus-secret-service-keyring-store = { version = "1.0", features = ["rt-tokio-crypto-rust"] }
