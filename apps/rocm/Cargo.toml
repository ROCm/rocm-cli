[package]
name = "rocm"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
publish.workspace = true

[lints]
workspace = true

[features]
e2e-test-hooks = ["rocm-engine-lemonade/e2e-test-hooks"]

[dependencies]
anyhow.workspace = true
clap.workspace = true
clap_complete.workspace = true
crossterm.workspace = true
flate2 = "1.1"
keyring-core.workspace = true
rocm-core = { path = "../../crates/rocm-core" }
rocm-deps = { path = "../../crates/rocm-deps" }
# rocm-dash unified dashboard launch. The
# telemetry daemon + ratatui-0.30 TUI are launched from the `dash` verb; tokio
# drives the async daemon/TUI from the otherwise-sync `rocm` binary.
# rocm-dash-core is a direct dep so the launcher front door can build serving
# `Instance`s from the managed-service registry.
rocm-dash-core = { path = "../../crates/rocm-dash-core" }
rocm-dash-daemon = { path = "../../crates/rocm-dash-daemon" }
rocm-dash-tui = { path = "../../crates/rocm-dash-tui" }
tokio = { workspace = true }
rocm-engine-lemonade = { path = "../../engines/lemonade" }
rocm-engine-protocol = { path = "../../crates/rocm-engine-protocol" }
rocmd = { path = "../rocmd" }
rocm-engine-vllm = { path = "../../engines/vllm" }
rpassword.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
tar = "0.4"
tracing = "0.1"
tracing-appender = "0.2"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
unicode-width = "0.2"
ureq = { version = "2.12", features = ["native-certs"] }

[target.'cfg(unix)'.dependencies]
libc.workspace = true

[target.'cfg(windows)'.dependencies]
windows-native-keyring-store = "1.1"

[target.'cfg(target_os = "macos")'.dependencies]
apple-native-keyring-store = { version = "1.0", features = ["keychain"] }

[target.'cfg(any(target_os = "linux", target_os = "freebsd", target_os = "openbsd"))'.dependencies]
zbus-secret-service-keyring-store = { version = "1.0", features = ["rt-tokio-crypto-rust"] }

[dev-dependencies]
# Property-based tests for the byte-size formatter behind the `download:
# approved up to …` line. "A size is printed in its own unit" has to hold at
# every unit boundary, and the narrow band where `{:.1}` rounding reaches 1024.0
# is exactly the input a hand-picked example misses. Same version and features
# as rocm-core's, so no new crate or feature enters the lockfile.
# Test-only, so it adds nothing to any shipped binary.
proptest = { version = "1", default-features = false, features = ["std"] }
