[package]
name = "rocmd"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
publish.workspace = true

[lints]
workspace = true

[features]
e2e-test-hooks = ["rocm-core/e2e-test-hooks"]

[dependencies]
anyhow.workspace = true
async-stream.workspace = true
axum.workspace = true
# Forwards the API docs' try-it requests to the model server, over plain
# HTTP to the address its record names (loopback for a server bound to every
# interface), so no TLS stack; `stream` relays streamed completions as they
# arrive.
reqwest = { version = "0.12", default-features = false, features = ["stream"] }
clap.workspace = true
rocm-core = { path = "../../crates/rocm-core" }
rocm-engine-protocol = { path = "../../crates/rocm-engine-protocol" }
serde.workspace = true
serde_json.workspace = true
sha2 = "0.10"
tokio.workspace = true
ureq = { version = "2.12", features = ["native-certs"] }
# API docs for running model servers: OpenAPI model + Swagger UI. `vendored`
# compiles the Swagger UI assets in, so the build downloads nothing and the
# page works offline.
utoipa = "6"
utoipa-swagger-ui = { version = "10", default-features = false, features = ["vendored"] }

[dev-dependencies]
# The fake engine child both engine IPC callers are tested against.
rocm-engine-protocol = { path = "../../crates/rocm-engine-protocol", features = ["test-support"] }

[target.'cfg(unix)'.dev-dependencies]
# The SIGPIPE disposition a test restores in a re-executed child.
libc.workspace = true
