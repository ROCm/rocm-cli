# Per-crate line-coverage floors, enforced by `cargo xtask coverage`.
#
# Generated by `cargo xtask coverage --bless`; do not edit by hand.
#
# Each floor is the crate's measured line coverage at the time it was blessed,
# rounded down. A crate falling more than the tolerance in `xtask/src/coverage.rs`
# below its floor fails CI. Raising a floor after adding tests is a re-bless.
#
# These are `cargo llvm-cov` line percentages, which count `#[cfg(test)]` modules
# as covered source. See the module comment in `xtask/src/coverage.rs` for what
# that inflates, and why the floors are per crate rather than one workspace number.

