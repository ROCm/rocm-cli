            echo "name filter active: $NAME_FILTER"
            cargo xtask e2e -- --name "$NAME_FILTER"
          else
            cargo xtask e2e
          fi

      - name: Upload E2E report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
