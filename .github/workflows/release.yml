name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag (e.g. v0.1.0)"
        required: true
      pypi_repository:
        description: "PyPI index the publish-pypi job uploads to when that job is enabled (a TestPyPI rehearsal by default)"
        required: false
        default: testpypi
        type: choice
        options:
          - testpypi
          - pypi

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  # setup-rust-toolchain v2 no longer sets this; its replacement,
  # CARGO_BUILD_WARNINGS=deny, needs cargo 1.97+ and we pin 1.96.0
  # (rust-toolchain.toml). Once the toolchain reaches 1.97, replace this with
  # `CARGO_BUILD_WARNINGS: deny` instead (set at workflow level so it reaches
  # jobs that don't use setup-rust-toolchain too).
  RUSTFLAGS: -D warnings
  # aws-lc-sys 0.46 and later auto-detect an AWS-LC already installed on the
  # build host and link it when found. Release binaries must not depend on
  # what the runner or build container happens to have, so always build the
  # vendored copy.
  AWS_LC_SYS_USE_SYSTEM: "0"
  # REQUIRED, not dormant: every readiness step below runs --require-signatures,
  # which now means signatures must actually verify, so this is the public key
  # the release is verified against. Removing or blanking the secret fails every
  # release run — GitHub expands an unset secret to the empty string, which the
  # gate treats as "no key" and rejects. It is the public half only; the private
  # signing key stays step-scoped.
  ROCM_CLI_SIGNING_PUBLIC_KEY_PEM: ${{ secrets.ROCM_CLI_SIGNING_PUBLIC_KEY_PEM }}
  # Production trust gate — dormant until the owner sets the repository variable
  # ROCM_CLI_REQUIRE_PRODUCTION_TRUST (e.g. "1") and provides the trust inputs
  # below. While the variable is unset/falsy, release_readiness.py skips
  # validate_production_trust() and behavior is unchanged. The values are public
  # keys and paths (not the private signing key, which stays step-scoped). When
  # enabling the gate, the recipe-index inputs also require a step that
  # materializes the hosted index + its .sig into the workspace.
  ROCM_CLI_REQUIRE_PRODUCTION_TRUST: ${{ vars.ROCM_CLI_REQUIRE_PRODUCTION_TRUST }}
  ROCM_CLI_METADATA_PUBLIC_KEY_PEM: ${{ secrets.ROCM_CLI_METADATA_PUBLIC_KEY_PEM }}
  ROCM_CLI_MODEL_RECIPE_INDEX_PATH: ${{ vars.ROCM_CLI_MODEL_RECIPE_INDEX_PATH }}
  ROCM_CLI_MODEL_RECIPE_INDEX_PUBLIC_KEY_PATH: ${{ vars.ROCM_CLI_MODEL_RECIPE_INDEX_PUBLIC_KEY_PATH }}

jobs:
  release:
    # Creates, uploads and deletes releases; the workflow default is read-only.
    permissions:
      contents: write
    name: Build Linux release assets
    runs-on: ubuntu-24.04 # one LTS: the assets are built in the manylinux container, not on the image
    outputs:
      version: ${{ steps.version.outputs.value }}
      # "true" only when the wheel was built, passed its checks and was
      # uploaded; the publish-pypi job needs it.
      wheel_built: ${{ steps.upload_wheel.outcome == 'success' && 'true' || 'false' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions-rust-lang/setup-rust-toolchain@a188e68d0fd2bd36ad51dccb2b07ba6e75105f30 # v2.0.1
        with:
          # No rust-cache restore/save: this job holds publishing credentials,
          # so it builds from a clean tree rather than a restorable cache.
          cache: false

      - name: Verify pinned keys match the signing key
        run: cargo xtask verify-pinned-keys

      - name: Determine version
        id: version
        run: |
          VERSION="${GITHUB_EVENT_INPUTS_TAG}"
          if [ -z "${VERSION}" ]; then
            VERSION="${GITHUB_REF_NAME}"
          fi
          case "${VERSION}" in
            v*) ;;
            *)
              echo "release version must be a tag beginning with v, got: ${VERSION}" >&2
              exit 1
              ;;
          esac
          case "${VERSION}" in
            */*|*\\*)
              echo "release version must not contain path separators, got: ${VERSION}" >&2
              exit 1
              ;;
          esac
          # `rocm version` reports a release only for this shape; any other
          # tag would ship binaries that call themselves 0.0.0-dev. Checked
          # here so it fails before the builds rather than after them. The
          # pattern and the length are RELEASE_TAG_PATTERN and
          # RELEASE_VERSION_MAX_LEN (+1 for the v) in apps/rocm/build.rs, and
          # its test `release_tag_grammar_is_the_same_everywhere` fails if
          # they differ.
          if ! [[ "${VERSION}" =~ ^v[0-9]+\.[0-9]+\.[0-9]+([-+][0-9A-Za-z.+-]+)?$ ]] || [ "${#VERSION}" -gt 65 ]; then
            echo "release version must be vX.Y.Z with an optional -pre or +build suffix of letters, digits, '.', '-' and '+', at most 65 characters, got: ${VERSION}" >&2
            exit 1
          fi
          echo "value=${VERSION}" >> "$GITHUB_OUTPUT"
        env:
          GITHUB_EVENT_INPUTS_TAG: ${{ github.event.inputs.tag }}

      - name: Build release binaries
        run: |
          # The bind-mount source must exist and be owned by the runner user;
          # Docker would otherwise create it as root, leaving the non-root
          # container user unable to write into CARGO_HOME/RUSTUP_HOME.
          mkdir -p "$HOME/.cargo"

          # Install system build deps as root: yum needs to write to
          # /var/cache/yum and the RPM db, which a non-root container user
          # cannot do. These land in the container's ephemeral layer (not the
          # bind mount), so this runs every time.
          docker run --rm \
            -v "$PWD":/work \
            -w /work \
            quay.io/pypa/manylinux2014_x86_64 \
            /bin/bash -lc '
              set -euo pipefail
              yum install -y pkgconfig libcap-devel
            '

          # Build as the runner user so Cargo/rustup files written into the bind
          # mount are owned by the runner, not root.
          #
          # ROCM_CLI_RELEASE_REF is forwarded explicitly: this container sees
          # none of GitHub's own GITHUB_REF_* env, which `apps/rocm/build.rs`
          # would otherwise fall back to (and which isn't set at all for a
          # workflow_dispatch release, since the tag is an input, not a ref).
          # The "Determine version" step above already resolved the one true
          # release version; every version-reporting surface must embed that
          # same value, not re-derive it from ambient context this container
          # doesn't have.
          docker run --rm \
            -u "$(id -u):$(id -g)" \
            -e CARGO_HOME=/host-cargo \
            -e RUSTUP_HOME=/host-cargo/rustup \
            -e ROCM_CLI_RELEASE_REF="${STEPS_VERSION_OUTPUTS_VALUE}" \
            -e AWS_LC_SYS_USE_SYSTEM \
            -v "$HOME/.cargo":/host-cargo \
            -v "$PWD":/work \
            -w /work \
            quay.io/pypa/manylinux2014_x86_64 \
            /bin/bash -lc '
              set -euo pipefail
              if [ ! -f /host-cargo/bin/cargo ]; then
                curl -fsSL https://sh.rustup.rs | sh -s -- -y --profile minimal --default-toolchain none --no-modify-path
              fi
              export PATH="/host-cargo/bin:$PATH"
              cargo build --release -p rocm -p rocmd -p xtask
            '
        env:
          STEPS_VERSION_OUTPUTS_VALUE: ${{ steps.version.outputs.value }}

      # The tag shape of `rocm version` (`X.Y.Z (vX.Y.Z, <hash>)`) is otherwise
      # unit-tested only: every PR and nightly build resolves a branch, which
      # reports `0.0.0-dev`. Run the binary this release ships and check that it
      # leads with the tag's own version; "Determine version" has already
      # checked that the tag has the `vX.Y.Z` shape that makes it a release.
      - name: Check the release binary's version
        env:
          VERSION: ${{ steps.version.outputs.value }}
        run: |
          OUTPUT="$(target/release/rocm --version)"
          EXPECTED_PREFIX="rocm-cli ${VERSION#v} (${VERSION}, "
          if [[ "${OUTPUT}" != "${EXPECTED_PREFIX}"*")" ]]; then
            echo "release binary reports '${OUTPUT}', expected '${EXPECTED_PREFIX}<hash>)'" >&2
            exit 1
          fi
          echo "release binary reports: ${OUTPUT}"

      - name: Package release bundle
        env:
          ROCM_CLI_SIGNING_PRIVATE_KEY_PEM: ${{ secrets.ROCM_CLI_SIGNING_PRIVATE_KEY_PEM }}
          ROCM_CLI_REQUIRE_SIGNATURE: "1"
          STEPS_VERSION_OUTPUTS_VALUE: ${{ steps.version.outputs.value }}
        run: |
          VERSION="${STEPS_VERSION_OUTPUTS_VALUE}"
          DIST="rocm-cli-${VERSION}-linux-amd64"

          chmod +x install.sh
          cargo xtask package "${DIST}"

          cp "dist/${DIST}.tar.gz" dist/rocm-cli-linux-amd64.tar.gz
          (cd dist && sha256sum rocm-cli-linux-amd64.tar.gz > rocm-cli-linux-amd64.tar.gz.sha256)
          if [ -f "dist/${DIST}.tar.gz.sig" ]; then
            cp "dist/${DIST}.tar.gz.sig" dist/rocm-cli-linux-amd64.tar.gz.sig
          else
            echo "release signature was not produced" >&2
            exit 1
          fi
          python scripts/release_readiness.py \
            --dist dist \
            --require-signatures \
            --require-rocm-asset-names \
            --require-exact-assets \
            --asset "${DIST}.tar.gz" \
            --asset rocm-cli-linux-amd64.tar.gz

      - name: Create or update release
        env:
          GH_TOKEN: ${{ github.token }}
          STEPS_VERSION_OUTPUTS_VALUE: ${{ steps.version.outputs.value }}
        run: |
          VERSION="${STEPS_VERSION_OUTPUTS_VALUE}"
          NOTES="$(cat <<EOF
          Install the latest stable release on Linux x86_64:

          \`\`\`bash
          curl -fsSL https://raw.githubusercontent.com/${{ github.repository }}/main/install.sh | sh
          \`\`\`

          Install the latest stable release on Windows x86_64 from PowerShell:

          \`\`\`powershell
          \$script = "\$env:TEMP\install-rocm-cli.ps1"; irm https://raw.githubusercontent.com/${{ github.repository }}/main/install.ps1 -OutFile \$script; powershell -ExecutionPolicy Bypass -File \$script
          \`\`\`

          Install a specific tagged release:

          \`\`\`bash
          curl -fsSL https://raw.githubusercontent.com/${{ github.repository }}/main/install.sh | sh -s -- ${VERSION}
          \`\`\`
          EOF
          )"
          if gh release view "${VERSION}" >/dev/null 2>&1; then
            EXISTING_BODY="$(gh release view "${VERSION}" --json body -q .body)"
            if [[ "${EXISTING_BODY}" != *"Install the latest stable release on Linux x86_64"* ]]; then
              if [ -n "${EXISTING_BODY}" ]; then
                COMBINED_NOTES="${EXISTING_BODY}"$'\n\n'"${NOTES}"
                gh release edit "${VERSION}" --notes "${COMBINED_NOTES}"
              else
                gh release edit "${VERSION}" --notes "${NOTES}"
              fi
            fi
            gh release upload "${VERSION}" dist/*.tar.gz dist/*.tar.gz.sha256 dist/*.sig --clobber
            exit 0
          fi
          gh release create "${VERSION}" \
            --draft \
            --title "rocm-cli ${VERSION}" \
            --notes "${NOTES}" \
            dist/*.tar.gz dist/*.tar.gz.sha256 dist/*.sig

      # The wheel steps run after the release upload, so the release asset set
      # is settled before anything lands under dist/wheels. The wheel is built
      # from the exact target/release binaries that were just packaged and
      # signed: nothing is rebuilt, so its payload is byte-identical to the
      # copy inside the signed archive.
      - name: Build Python wheel
        id: wheel
        # The wheel channel is dormant (see publish-pypi), so a wheel problem
        # must not hold back the release that carries the signed archives. The
        # failure still shows on the step and in the "Report wheel status"
        # annotation, and publish-pypi stays skipped. Remove
        # continue-on-error from the wheel steps when publishing is turned on.
        continue-on-error: true
        env:
          VERSION: ${{ steps.version.outputs.value }}
        run: |
          # The wheel builder's own checks run on every release.
          python scripts/build_wheel.py --self-test
          # A tag PEP 440 cannot express (v0.1.0-preview.1, for one) is valid
          # for the release but has no wheel: the script prints a notice and
          # writes nothing, and the steps below stand down.
          python scripts/build_wheel.py \
            --bin-dir target/release \
            --platform linux-amd64 \
            --tag "${VERSION}" \
            --skip-unmappable-tag \
            --out-dir dist/wheels
          if compgen -G 'dist/wheels/*.whl' > /dev/null; then
            echo "built=true" >> "$GITHUB_OUTPUT"
          else
            echo "built=false" >> "$GITHUB_OUTPUT"
            echo "::warning title=No Python wheel::${VERSION} has no PEP 440 spelling, so no wheel was built; the release carries on with its archives"
          fi

      # The wheel is tagged manylinux_2_17; this reads that tag back from the
      # binaries instead of trusting the build container. auditwheel is pinned
      # and installed into a throwaway venv.
      - name: Verify the wheel's manylinux tag
        id: manylinux
        if: steps.wheel.outputs.built == 'true'
        continue-on-error: true # see "Build Python wheel"
        run: |
          python -m venv "${RUNNER_TEMP}/auditwheel"
          "${RUNNER_TEMP}/auditwheel/bin/python" -m pip install --disable-pip-version-check auditwheel==6.8.2
          python scripts/build_wheel.py \
            --auditwheel "${RUNNER_TEMP}/auditwheel/bin/auditwheel" \
            --check-manylinux dist/wheels/*.whl

      - name: Smoke test the Python wheel
        id: smoke
        if: steps.wheel.outputs.built == 'true'
        continue-on-error: true # see "Build Python wheel"
        env:
          VERSION: ${{ steps.version.outputs.value }}
        run: |
          shopt -s nullglob
          wheels=(dist/wheels/*.whl)
          if [ "${#wheels[@]}" -ne 1 ]; then
            echo "expected exactly one linux wheel, found ${#wheels[@]}" >&2
            exit 1
          fi
          venv="${RUNNER_TEMP}/wheel-smoke"
          rm -rf "${venv}"
          python -m venv "${venv}"
          "${venv}/bin/python" -m pip install --no-index --disable-pip-version-check "${wheels[0]}"
          # The wheel ships the real ELF binaries in its .data/scripts
          # directory rather than console-script shims, so these must be the
          # native executables themselves.
          for binary in rocm rocmd; do
            magic="$(head -c 4 "${venv}/bin/${binary}" | od -An -tx1 | tr -d ' \n')"
            if [ "${magic}" != "7f454c46" ]; then
              echo "${binary} is not an ELF executable (magic ${magic}); a shim would break current_exe()" >&2
              exit 1
            fi
          done
          # The installed binaries must be the ones this tag built, so a stale
          # target/release tree cannot ship a wheel that disagrees with the
          # release. `rocm --version` is `rocm-cli X.Y.Z (<tag>, <hash>)`, the
          # shape "Check the release binary's version" checks. `rocmd` reports
          # the workspace package version, which is not bumped per release, so
          # it is only required to run and name itself.
          release="${VERSION#v}"
          reported="$("${venv}/bin/rocm" --version)"
          prefix="rocm-cli ${release} (${VERSION}, "
          if [[ "${reported}" != "${prefix}"*")" ]]; then
            echo "rocm reports '${reported}', expected '${prefix}<hash>)'" >&2
            exit 1
          fi
          reported="$("${venv}/bin/rocmd" --version)"
          if [[ "${reported}" != "rocmd "* ]]; then
            echo "rocmd reports '${reported}', expected 'rocmd <version>'" >&2
            exit 1
          fi
          # `rocm uninstall` must leave pip's files to pip. A dry run, from a
          # scratch home, removes nothing.
          scratch="${RUNNER_TEMP}/wheel-smoke-home"
          plan="$(HOME="${scratch}" ROCM_CLI_CONFIG_DIR="${scratch}/config" ROCM_CLI_DATA_DIR="${scratch}/data" ROCM_CLI_CACHE_DIR="${scratch}/cache" \
            "${venv}/bin/rocm" uninstall --dry-run --keep-config --keep-data --keep-cache)"
          echo "${plan}"
          if ! grep -q "binary removal skipped because .* sits in a Python environment" <<<"${plan}"; then
            echo "rocm uninstall --dry-run did not leave the pip-owned binaries alone" >&2
            exit 1
          fi
          if grep -q -- "- binary:" <<<"${plan}"; then
            echo "rocm uninstall --dry-run plans to remove a pip-owned binary" >&2
            exit 1
          fi
          rm -rf "${venv}" "${scratch}"

      # Uploaded only once the wheel has passed both checks above.
      - name: Upload Python wheel
        id: upload_wheel
        if: steps.wheel.outputs.built == 'true' && steps.manylinux.outcome == 'success' && steps.smoke.outcome == 'success'
        continue-on-error: true # see "Build Python wheel"
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: wheel-linux-amd64
          path: dist/wheels/
          if-no-files-found: error

      - name: Report wheel status
        if: always() && steps.upload_wheel.outcome != 'success'
        run: echo "::warning title=Python wheel not staged::the Linux wheel was not built, did not pass its checks or was not uploaded; see the Python wheel steps above. The release itself is not affected and publish-pypi stays skipped."

  windows-release:
    # Creates, uploads and deletes releases; the workflow default is read-only.
    permissions:
      contents: write
    name: Build and upload Windows release
    runs-on: windows-latest
    needs: release
    outputs:
      # See the same output of the `release` job.
      wheel_built: ${{ steps.upload_wheel.outcome == 'success' && 'true' || 'false' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions-rust-lang/setup-rust-toolchain@a188e68d0fd2bd36ad51dccb2b07ba6e75105f30 # v2.0.1
        with:
          cache: false

      - name: Verify pinned keys match the signing key
        shell: pwsh
        run: cargo xtask verify-pinned-keys

      - name: Build release binaries
        shell: pwsh
        # See the Linux job's "Build release binaries" step: the release ref
        # must come from the resolved `release` job output, not ambient
        # GITHUB_REF_* context (unset for a workflow_dispatch release, since
        # the tag is an input there, not a ref) or local git state.
        env:
          ROCM_CLI_RELEASE_REF: ${{ needs.release.outputs.version }}
        run: cargo build --release -p rocm -p rocmd -p xtask

      # See the Linux job's "Check the release binary's version" step.
      - name: Check the release binary's version
        shell: pwsh
        env:
          VERSION: ${{ needs.release.outputs.version }}
        run: |
          $version = $env:VERSION
          $output = (& .\target\release\rocm.exe --version | Out-String).Trim()
          $prefix = "rocm-cli $($version.Substring(1)) ($version, "
          if (-not ($output.StartsWith($prefix, [StringComparison]::Ordinal) -and $output.EndsWith(')', [StringComparison]::Ordinal))) {
            throw "release binary reports '$output', expected '$prefix<hash>)'"
          }
          Write-Host "release binary reports: $output"

      - name: Package Windows bundle
        shell: pwsh
        env:
          ROCM_CLI_SIGNING_PRIVATE_KEY_PEM: ${{ secrets.ROCM_CLI_SIGNING_PRIVATE_KEY_PEM }}
          ROCM_CLI_REQUIRE_SIGNATURE: "1"
          NEEDS_RELEASE_OUTPUTS_VERSION: ${{ needs.release.outputs.version }}
        run: |
          $version = "$env:NEEDS_RELEASE_OUTPUTS_VERSION"
          $dist = "rocm-cli-$version-windows-amd64"
          cargo xtask package $dist
          Copy-Item "dist\$dist.zip" "dist\rocm-cli-windows-amd64.zip"
          $hash = (Get-FileHash -Algorithm SHA256 -LiteralPath "dist\rocm-cli-windows-amd64.zip").Hash.ToLowerInvariant()
          Set-Content -LiteralPath "dist\rocm-cli-windows-amd64.zip.sha256" -Value "$hash  rocm-cli-windows-amd64.zip" -Encoding ascii
          if (Test-Path "dist\$dist.zip.sig") {
            Copy-Item "dist\$dist.zip.sig" "dist\rocm-cli-windows-amd64.zip.sig"
          } else {
            throw "release signature was not produced"
          }
          python .\scripts\release_readiness.py `
            --dist dist `
            --require-signatures `
            --require-rocm-asset-names `
            --require-exact-assets `
            --asset "$dist.zip" `
            --asset rocm-cli-windows-amd64.zip

      - name: Upload Windows release assets
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          NEEDS_RELEASE_OUTPUTS_VERSION: ${{ needs.release.outputs.version }}
        run: |
          $version = "$env:NEEDS_RELEASE_OUTPUTS_VERSION"
          # `dist\*` plus -Include, never -Recurse: with -Recurse this glob also
          # matches the wheel checksum sidecars under dist\wheels, which are not
          # release assets. Without a path wildcard, -Include silently matches
          # nothing at all.
          $assets = Get-ChildItem dist\* -File -Include *.zip,*.sha256,*.sig | ForEach-Object { $_.FullName }
          gh release upload $version @assets --clobber

      # The wheel steps run after the release upload, for the reason the Linux
      # job gives. See its "Build Python wheel" step.
      - name: Build Python wheel
        id: wheel
        continue-on-error: true # see "Build Python wheel" in the Linux job
        shell: pwsh
        env:
          NEEDS_RELEASE_OUTPUTS_VERSION: ${{ needs.release.outputs.version }}
        run: |
          $ErrorActionPreference = "Stop"
          python .\scripts\build_wheel.py --self-test
          if ($LASTEXITCODE -ne 0) { throw "wheel builder self-test failed" }
          python .\scripts\build_wheel.py `
            --bin-dir target\release `
            --platform windows-amd64 `
            --tag "$env:NEEDS_RELEASE_OUTPUTS_VERSION" `
            --skip-unmappable-tag `
            --out-dir dist\wheels
          if ($LASTEXITCODE -ne 0) { throw "wheel build failed" }
          $built = @(Get-ChildItem dist\wheels -File -Filter *.whl -ErrorAction SilentlyContinue).Count -gt 0
          "built=$($built.ToString().ToLowerInvariant())" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          if (-not $built) {
            Write-Host "::warning title=No Python wheel::$env:NEEDS_RELEASE_OUTPUTS_VERSION has no PEP 440 spelling, so no wheel was built; the release carries on with its archives"
          }

      - name: Smoke test the Python wheel
        id: smoke
        if: steps.wheel.outputs.built == 'true'
        continue-on-error: true # see "Build Python wheel" in the Linux job
        shell: pwsh
        env:
          NEEDS_RELEASE_OUTPUTS_VERSION: ${{ needs.release.outputs.version }}
        run: |
          $ErrorActionPreference = "Stop"
          function Invoke-Checked {
            param([string]$Exe, [string[]]$Arguments)
            & $Exe @Arguments
            if ($LASTEXITCODE -ne 0) {
              throw "$Exe $($Arguments -join ' ') failed with exit code $LASTEXITCODE"
            }
          }
          $tag = $env:NEEDS_RELEASE_OUTPUTS_VERSION
          $wheels = @(Get-ChildItem dist\wheels -File -Filter *.whl)
          if ($wheels.Count -ne 1) {
            throw "expected exactly one windows wheel, found $($wheels.Count)"
          }
          $venv = Join-Path $env:RUNNER_TEMP "wheel-smoke"
          if (Test-Path -LiteralPath $venv) {
            Remove-Item -Recurse -Force -LiteralPath $venv
          }
          Invoke-Checked python @("-m", "venv", $venv)
          Invoke-Checked "$venv\Scripts\python.exe" @("-m", "pip", "install", "--no-index", "--disable-pip-version-check", $wheels[0].FullName)
          # The wheel ships the real PE binaries in its .data/scripts directory
          # rather than console-script shims, so these must be the native
          # executables themselves.
          foreach ($binary in @("rocm.exe", "rocmd.exe")) {
            $path = Join-Path "$venv\Scripts" $binary
            $magic = [System.IO.File]::ReadAllBytes($path)[0..1]
            if ($magic[0] -ne 0x4D -or $magic[1] -ne 0x5A) {
              throw "$binary is not a PE executable; a shim would break current_exe()"
            }
          }
          # See the Linux job's smoke test: `rocm --version` is
          # `rocm-cli X.Y.Z (<tag>, <hash>)`, and `rocmd` only has to run and
          # name itself.
          $release = if ($tag.StartsWith("v", [StringComparison]::Ordinal)) { $tag.Substring(1) } else { $tag }
          $reported = ((& "$venv\Scripts\rocm.exe" "--version") -join "").Trim()
          if ($LASTEXITCODE -ne 0) { throw "rocm --version failed with exit code $LASTEXITCODE" }
          $prefix = "rocm-cli $release ($tag, "
          if (-not ($reported.StartsWith($prefix, [StringComparison]::Ordinal) -and $reported.EndsWith(')', [StringComparison]::Ordinal))) {
            throw "rocm reports '$reported', expected '$prefix<hash>)'"
          }
          $reported = ((& "$venv\Scripts\rocmd.exe" "--version") -join "").Trim()
          if ($LASTEXITCODE -ne 0) { throw "rocmd --version failed with exit code $LASTEXITCODE" }
          if (-not $reported.StartsWith("rocmd ", [StringComparison]::Ordinal)) {
            throw "rocmd reports '$reported', expected 'rocmd <version>'"
          }
          # `rocm uninstall` must leave pip's files to pip. A dry run, from a
          # scratch home, removes nothing.
          $scratch = Join-Path $env:RUNNER_TEMP "wheel-smoke-home"
          $env:HOME = $scratch
          $env:USERPROFILE = $scratch
          $env:ROCM_CLI_CONFIG_DIR = Join-Path $scratch "config"
          $env:ROCM_CLI_DATA_DIR = Join-Path $scratch "data"
          $env:ROCM_CLI_CACHE_DIR = Join-Path $scratch "cache"
          $plan = (& "$venv\Scripts\rocm.exe" uninstall --dry-run --keep-config --keep-data --keep-cache | Out-String)
          if ($LASTEXITCODE -ne 0) { throw "rocm uninstall --dry-run failed with exit code $LASTEXITCODE" }
          Write-Host $plan
          if ($plan -notmatch 'binary removal skipped because .* sits in a Python environment') {
            throw "rocm uninstall --dry-run did not leave the pip-owned binaries alone"
          }
          if ($plan.Contains("- binary:")) {
            throw "rocm uninstall --dry-run plans to remove a pip-owned binary"
          }
          Remove-Item -Recurse -Force -LiteralPath $venv

      - name: Upload Python wheel
        id: upload_wheel
        if: steps.wheel.outputs.built == 'true' && steps.smoke.outcome == 'success'
        continue-on-error: true # see "Build Python wheel" in the Linux job
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: wheel-windows-amd64
          path: dist/wheels/
          if-no-files-found: error

      - name: Report wheel status
        if: always() && steps.upload_wheel.outcome != 'success'
        shell: pwsh
        run: Write-Host "::warning title=Python wheel not staged::the Windows wheel was not built, did not pass its checks or was not uploaded; see the Python wheel steps above. The release itself is not affected and publish-pypi stays skipped."

  publish-release:
    # Creates, uploads and deletes releases; the workflow default is read-only.
    permissions:
      contents: write
    name: Publish release
    runs-on: ubuntu-24.04 # one LTS: publishing only
    needs:
      - release
      - windows-release
    steps:
      - name: Publish draft release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          NEEDS_RELEASE_OUTPUTS_VERSION: ${{ needs.release.outputs.version }}
        run: |
          VERSION="${NEEDS_RELEASE_OUTPUTS_VERSION}"
          RELEASE_ID="$(gh release view "${VERSION}" --json databaseId -q .databaseId)"
          gh api --method PATCH "repos/${GITHUB_REPOSITORY}/releases/${RELEASE_ID}" -f draft=false

  # Dormant: the job runs only once the owner has registered the PyPI project
  # and its Trusted Publisher and set the repository variable
  # ROCM_CLI_PUBLISH_PYPI to "1" or "true". The gate is an allowlist, so any
  # other value ("FALSE", "no", "off", unset) leaves it skipped, like the
  # ROCM_CLI_REQUIRE_PRODUCTION_TRUST gate in the env block above. While it is
  # skipped nothing reaches any index; the wheels are still built, smoke-tested
  # and kept as workflow artifacts, and the release asset set is unchanged. It
  # also skips when either platform has no wheel (a tag with no PEP 440
  # spelling, or a wheel that failed its checks).
  publish-pypi:
    name: Publish wheels to PyPI
    runs-on: ubuntu-24.04 # one LTS: publishing only
    needs:
      - release
      - windows-release
      # After publish-release, so wheels never reach an index before the
      # release they correspond to is out of draft.
      - publish-release
    if: (vars.ROCM_CLI_PUBLISH_PYPI == '1' || vars.ROCM_CLI_PUBLISH_PYPI == 'true') && needs.release.outputs.wheel_built == 'true' && needs.windows-release.outputs.wheel_built == 'true'
    environment: pypi
    permissions:
      # Trusted Publishing mints a short-lived OIDC token instead of using a
      # stored API token, so this job needs id-token: write and no upload
      # secrets, and nothing else.
      contents: read
      id-token: write
    steps:
      - name: Resolve publication target
        id: target
        env:
          # Empty on a tag push, which always means the real index. A manual
          # dispatch defaults to testpypi, so the irreversible action (a real
          # upload burns that version for good) is always opt-in.
          REQUESTED: ${{ github.event.inputs.pypi_repository }}
        run: |
          TARGET="${REQUESTED:-pypi}"
          case "${TARGET}" in
            pypi|testpypi) ;;
            *)
              echo "unknown pypi_repository input: ${TARGET}" >&2
              exit 1
              ;;
          esac
          echo "value=${TARGET}" >> "$GITHUB_OUTPUT"

      - name: Download built wheels
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: wheel-*
          path: dist/wheels
          merge-multiple: true

      - name: Verify wheel checksums and stage the upload directory
        run: |
          shopt -s nullglob
          wheels=(dist/wheels/*.whl)
          if [ "${#wheels[@]}" -ne 2 ]; then
            echo "expected 2 wheels (linux + windows), found ${#wheels[@]}" >&2
            exit 1
          fi
          # Re-verify each wheel against the sidecar written beside it on the
          # builder runner. The sidecar travels in the same artifact, so this
          # catches a file corrupted or truncated in artifact storage, not a
          # compromised builder that wrote both consistently.
          for wheel in "${wheels[@]}"; do
            sidecar="${wheel}.sha256"
            if [ ! -f "${sidecar}" ]; then
              echo "missing checksum sidecar: ${sidecar}" >&2
              exit 1
            fi
            expected="$(awk 'NR == 1 { print $1 }' "${sidecar}")"
            actual="$(sha256sum "${wheel}" | awk '{ print $1 }')"
            if [ -z "${expected}" ] || [ "${expected}" != "${actual}" ]; then
              echo "checksum mismatch for ${wheel}: expected '${expected}', got '${actual}'" >&2
              exit 1
            fi
            echo "verified $(basename "${wheel}") ${actual}"
          done
          # The publish action uploads every file in packages-dir, so stage the
          # wheels on their own: the .sha256 sidecars are not distributions.
          mkdir -p dist/pypi
          cp "${wheels[@]}" dist/pypi/

      # Exactly one of the two steps below runs; neither passes credentials
      # (Trusted Publishing only), and both leave PEP 740 attestations at the
      # action's enabled default.
      - name: Publish to TestPyPI (rehearsal)
        if: steps.target.outputs.value == 'testpypi'
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2
        with:
          packages-dir: dist/pypi
          repository-url: https://test.pypi.org/legacy/
          print-hash: true

      - name: Publish to PyPI
        if: steps.target.outputs.value == 'pypi'
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2
        with:
          packages-dir: dist/pypi
          print-hash: true
