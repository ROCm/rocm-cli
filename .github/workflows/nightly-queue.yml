# GPU E2E on the shared queue — publish a run that has already finished.
#
# queue-run.yml starts, waits for and publishes runs. This publishes one again
# by its id, for instance one whose queue-run.yml job was cancelled while the
# run went on: once the run's lanes are done, it has the queue side finish the
# run if no one has, prints its report and lane matrix, uploads the lanes'
# files, and passes or fails with the run's verdict. It needs no credential, so
# the shared self-hosted runner never holds the queue's. What that does and does
# not protect is in docs/nightly-on-the-queue.md.
name: Nightly E2E (queue)

on:
  # Manual only, and gating nothing.
  workflow_dispatch:
    inputs:
      request_id:
        description: "The id of the finished run to publish"
        type: string
        required: true

# Nothing here reads the repository. Uploading files uses the per-job runtime
# token GitHub issues to every job regardless of these permissions.
permissions: {}

concurrency:
  group: nightly-queue
  cancel-in-progress: false

jobs:
  publish:
    name: Publish nightly results
    runs-on: [queue-report]
    # Nothing here waits on GPUs, but finishing a run nobody finished fetches
    # and scans every lane's files, which the publisher allows 30 minutes.
    timeout-minutes: 45
    steps:
      - name: Publish the run
        env:
          REQUEST_ID: ${{ inputs.request_id }}
        # One line: the workflow contract forbids backslashes in this file.
        run: /opt/queue/bin/queue-publish --out "${RUNNER_TEMP}/results" --request "${REQUEST_ID}"

      - name: Upload lane results
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: nightly-queue-results
          path: ${{ runner.temp }}/results
          # The publisher's files only; a lane's hidden files are not published.
          include-hidden-files: false
          if-no-files-found: warn
