[package]
name = "rocm-core"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
publish.workspace = true

[lints]
workspace = true

[features]
# Lets the E2E suite re-root the hardware probes under a simulated host; see
# `src/hardware_root.rs`. Never enabled in a release build.
e2e-test-hooks = []
# Compiles the `foreign_temp_probe` test probe so a dependent crate's tests can
# use it. Enabled only from a `[dev-dependencies]` entry; never in a shipped
# build.
test-support = []

[build-dependencies]
cc = "1"

[dependencies]
anyhow.workspace = true
directories.workspace = true
libc.workspace = true
rand.workspace = true
regex = "1"
rsa.workspace = true
# File identity (inode / Windows file index), so the lock-free JSONL readers in
# `jsonl_store.rs` can tell when a store rotation renamed a file under them.
same-file = "1"
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
sysinfo.workspace = true
toml = "1.1"
ureq = { version = "2.12", features = ["native-certs"] }

[dev-dependencies]
# Property-based tests for the path comparison that decides whether a folder
# may be recursively deleted. The contract — "a path that resolves inside a
# protected system root is never reported unprotected" — has to hold for EVERY
# spelling of that path, which is exactly the shape an example test misses: the
# pre-existing example used `/etc/rocm-cli-test-runtime`, the one shape that
# happened to work, while `/etc/` and `$HOME/../../etc` sailed through.
#
# Also used by `disk_space`, for the same reason: its unit formatting, margin
# arithmetic and mount selection are small total functions whose contracts are
# easy to state over ALL inputs and awkward to cover with examples. And by the
# integration suites under `tests/` (download digest gate, signature
# verification, model selection and readiness), whose generators aim at near
# misses no example list enumerates.
# Test-only, so it adds nothing to any shipped binary.
proptest = { version = "1", default-features = false, features = ["std"] }
# Archive-extraction property tests (`src/archive_props.rs`) build hostile
# archives byte-by-byte and judge the result on the filesystem.
flate2 = "1"
# The exit-code lint in `fix.rs` parses the source rather than pattern-matching
# its text, so the spelling and layout of a literal do not matter to it (its doc
# comment lists what it still cannot see). Test-only; already in the lockfile
# through the derive macros.
syn = { version = "3", features = ["full", "visit"] }
tar = "0.4"
tempfile = "3"
# Reads the dynamic symbol table and dynamic section of the embedded
# `libmpi_cxx.so.40` stub (`openmpi.rs` tests), so the test checks the exported
# symbols, soname and `NEEDED` entries without shelling out to binutils
# (`unaligned`: `include_bytes!` data carries no alignment guarantee).
# Test-only; already in the lockfile through the `backtrace` crate.
object = { version = "0.37", default-features = false, features = ["read_core", "elf", "std", "unaligned"] }
# `report_trend` writes its own civil calendar so the shipped crate needs no date
# library; a test checks it against this for every day from 2000 to 2100.
chrono.workspace = true

[target.'cfg(target_os = "windows")'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Security", "Win32_Storage_FileSystem", "Win32_System_Registry", "Win32_System_SystemInformation", "Win32_System_Threading", "Win32_UI_WindowsAndMessaging"] }
