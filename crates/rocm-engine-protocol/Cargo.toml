[package]
name = "rocm-engine-protocol"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
publish.workspace = true

[lints]
workspace = true

[features]
# Compiles `fake_engine`, a stand-in engine child for tests, into the `rocm` and
# `rocmd` test builds. Never enabled in a release build.
test-support = []

[dependencies]
anyhow.workspace = true
rocm-core = { path = "../rocm-core" }
serde.workspace = true
serde_json.workspace = true

[dev-dependencies]
# Property tests for the engine protocol decoders (`tests/protocol_properties.rs`).
proptest = { version = "1", default-features = false, features = ["std"] }

[target.'cfg(unix)'.dev-dependencies]
# The SIGPIPE disposition a test installs in a re-executed child.
libc.workspace = true
