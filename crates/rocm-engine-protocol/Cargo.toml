[package]
name = "rocm-engine-protocol"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
publish.workspace = true

[lints]
workspace = true

[features]
# Compiles the test-only modules into the test builds that turn it on (`rocm`,
# `rocmd`, and the `lemonade`, `vllm` and `aim` engines): `fake_engine`, a
# stand-in engine child (Unix only), and `engine_contract`, the shared engine
# protocol contract check. Never enabled in a release build.
test-support = []

[dependencies]
anyhow.workspace = true
rocm-core = { path = "../rocm-core" }
serde.workspace = true
serde_json.workspace = true

[dev-dependencies]
# The leftover a killed owner-only key store leaves, for the tests of the
# cleanups that remove it (`atomic_write::stage_owner_only_file_unpublished`).
rocm-core = { path = "../rocm-core", features = ["test-support"] }
# Property tests for the engine protocol decoders (`tests/protocol_properties.rs`).
proptest = { version = "1", default-features = false, features = ["std"] }

[target.'cfg(unix)'.dev-dependencies]
# The SIGPIPE disposition a test installs in a re-executed child.
libc.workspace = true
