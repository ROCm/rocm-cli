# Config for the `docs-links` CI job (.github/workflows/ci.yml) and the matching
# `lychee` prek hook (.pre-commit-config.yaml), which check every markdown link
# in the repo outside hidden directories resolves, including the file
# citations in docs/architecture.md's per-crate inventories — see issue #578
# (its section headings and directory names stay bare and unchecked). Replaces
# the hand-rolled path-citation checker that used to live in
# xtask/src/architecture_doc.rs, now deleted.

# Only check local file/anchor links, no network requests. Keeps this gate
# immune to external-host flakiness (rate limits, transient DNS) — see the
# "Offline-only" tradeoff recorded in issue #578.
offline = true

# Check that `#anchor` fragments resolve too, not just the file path.
include_fragments = "anchor-only"

# GitHub's private-vulnerability-reporting links in SECURITY.md
# (../../security/advisories/new) are relative-looking but meant to resolve
# on GitHub's web UI, not as a local file — offline mode can't follow them.
exclude = [
  'security/advisories/new',
]

# docs/rocm-docs/ is Sphinx/MyST source, not plain markdown: its cross-doc
# anchors (e.g. `commands.md#model-serving`) are generated at Sphinx build
# time from `{include}` directives lychee doesn't evaluate, so it reports
# false positives there. That tree's correctness is already covered by the
# `docs-build` (Sphinx -W) CI job, which does understand MyST.
#
# The optional `./` matches the prek hook, which walks the directory `.` (so
# .gitignore is honoured) and sees paths as `./docs/...`; the CI glob sees
# `docs/...`. Either separator is accepted because the hook also runs on
# Windows.
exclude_path = [
  '^(\.[/\\])?docs[/\\]rocm-docs[/\\]',
]
