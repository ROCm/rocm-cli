## hawkeye license-header enforcement configuration.
## Run locally: hawkeye check
## Docs: https://github.com/korandoru/hawkeye
##
## Note on *.md: hawkeye excludes markdown by default, so each scope we DO want
## header-checked is force-included with a `!` negation below. A negation cannot
## be narrowed afterwards — a positive exclude never wins against it, and a
## pattern with no slash (`!*.md`) matches at every depth — so the scopes are
## enumerated and anchored instead of using one blanket `!**/*.md`. Adding a new
## top-level directory that holds tracked markdown means adding it to that list;
## otherwise its headers go unchecked.
##
## `skills/rocm-doctor/` is deliberately absent: it is a byte-verbatim mirror of
## the published skill in amd/skills (MIT there too), and its SKILL.md must open
## with YAML frontmatter for the skill loader, which pushes any header out of
## hawkeye's detection window. See AGENTS.md §7.

inlineHeader = """
Copyright © Advanced Micro Devices, Inc., or its affiliates.

SPDX-License-Identifier: MIT
"""

additionalHeaders = ["licenserc-md-header.toml"]

includes = [
  "**/*.rs",
  "**/*.py",
  "**/*.sh",
  "**/*.md",
]

excludes = [
  "!/*.md",
  "!.github/**/*.md",
  "!docs/**/*.md",
  "!skills/rocm-cli-assistant/*.md",
  "!tests/**/*.md",
  "target/**",
  ".claude/**",
  ".tmp-*/**",
  "third_party/**",
]

[mapping.MARKDOWN_STYLE]
extensions = ["md"]
