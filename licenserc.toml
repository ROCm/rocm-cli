## hawkeye license-header enforcement configuration.
## Run locally: hawkeye check
## Docs: https://github.com/fast/hawkeye

[header]
text = """
Copyright © Advanced Micro Devices, Inc., or its affiliates.

SPDX-License-Identifier: MIT
"""

[files]
includes = [
  "**/*.rs",
  "**/*.py",
  "**/*.sh",
  "**/*.md",
  "**/*.ps1",
]

excludes = [
  "target/**",
  ".claude/**",
  ".tmp-*/**",
  "third_party/**",
]

[[rules]]
extensions = ["md"]
style_out = "xml"

## hawkeye has no built-in comment syntax for .ps1: without this rule the file is
## reported `unsupported` and silently skipped (exit 0), so `includes` alone would
## not enforce anything.
[[rules]]
extensions = ["ps1"]
style_out = "script"
